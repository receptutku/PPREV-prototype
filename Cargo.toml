[workspace]
resolver = "3"
members = [
    "mock-registry",
    "offchain/crates/pprev-types",
    "offchain/crates/pprev-notary",
    "offchain/crates/pprev-prover",
]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
pprev-types = { path = "offchain/crates/pprev-types" }
pprev-notary = { path = "offchain/crates/pprev-notary" }
mock-registry = { path = "mock-registry" }

tlsn = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-alpha.15" }
k256 = { version = "0.13", features = ["ecdsa"] }

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
rcgen = "0.14"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
futures = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
debug = 1
