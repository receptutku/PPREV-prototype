[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]

solc_version = "0.8.36"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "cancun"
bytecode_hash = "ipfs"

allow_paths = ["../circuits/setup"]
remappings = ["forge-std/=lib/forge-std/src/", "pprev-circuits/=../circuits/setup/"]
fs_permissions = [{ access = "read", path = "./test/baseline/fixtures" }, { access = "read-write", path = "../test-vectors" }, { access = "read", path = "../policies" }, { access = "read-write", path = "../target/measure" }, { access = "read-write", path = "../target/l2" }]

[fuzz]
runs = 256
seed = "0x5050524556"

[invariant]
runs = 256
depth = 128
fail_on_revert = true
