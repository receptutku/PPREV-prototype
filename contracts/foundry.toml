[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]

solc_version = "0.8.36"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "cancun"
bytecode_hash = "ipfs"

fs_permissions = [{ access = "read-write", path = "../test-vectors" }]

[fuzz]
runs = 256
seed = "0x5050524556"

[invariant]
runs = 256
depth = 128
fail_on_revert = true
